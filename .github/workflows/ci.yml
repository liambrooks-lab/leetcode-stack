name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Setup C++ (GCC)
      run: |
        sudo apt-get update
        sudo apt-get install -y g++ build-essential

    - name: Run Validator
      run: make validate

    - name: Run Tests
      run: make test

    - name: Run Benchmarks
      run: make benchmark

    - name: Generate Index
      run: make index

    - name: Auto-Commit Generated Index & Benchmarks
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      run: |
        git config --local user.name "github-actions[bot]"
        git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add index/ benchmarks/
        git diff --quiet && git diff --staged --quiet || (git commit -m "chore(bot): auto-update repository index and benchmarks" && git push)
